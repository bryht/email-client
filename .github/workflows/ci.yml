name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libgtk-3-dev xvfb xdotool
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Desktop selftest (HTML isolation and composer)
        if: runner.os == 'Linux'
        env:
          EGL_LOG_LEVEL: fatal
        run: xvfb-run -a cargo run -p letterdesk-desktop -- --selftest
      - name: Desktop link test (links open in the system browser)
        if: runner.os == 'Linux'
        env:
          EGL_LOG_LEVEL: fatal
        run: xvfb-run -a -s "-screen 0 1280x820x24" scripts/desktop-link-test.sh

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
