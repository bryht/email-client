# cargo-deny 配置：检查依赖许可与已知安全漏洞。
# 只允许与 GPL-3.0-or-later 兼容的许可。

[graph]
all-features = true

[advisories]
version = 2
# 安全漏洞对所有依赖都报错。“已停止维护”和“不健全”只检查我们直接依赖的 crate：
# Dioxus Desktop 在 Linux 上经 wry/tao 依赖 GTK3 绑定（gtk-rs 已停止维护 GTK3 版本），
# 这类间接依赖我们无法替换，由上游迁移后再收紧。
unmaintained = "workspace"
unsound = "workspace"

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # libfuzzer-sys（Dioxus 图片解码的间接依赖）；FSF 认定与 GPL 兼容。
    "NCSA",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 工作区内部的路径依赖不发布到 crates.io，允许不写版本号。
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
