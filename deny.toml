# cargo-deny 配置：检查依赖许可与已知安全漏洞。
# 只允许与 GPL-3.0-or-later 兼容的许可。

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 工作区内部的路径依赖不发布到 crates.io，允许不写版本号。
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
