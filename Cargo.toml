[workspace]
resolver = "3"
members = ["crates/mail-core", "crates/ai", "crates/cli", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/bryht/email-client"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
mail-parser = "0.11"
similar = "2"
tempfile = "3"
wait-timeout = "0.2"
uuid = { version = "1", features = ["v4"] }
mail-core = { path = "crates/mail-core" }
ai = { path = "crates/ai" }
