[package]
name = "mail-sync"
description = "Letterdesk 收信同步：Outlook（微软登录 + Microsoft Graph）与 Gmail（IMAP）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mail-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
form_urlencoded = "1"
webbrowser = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
futures-util = "0.3"
time = { version = "0.3", features = ["std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }

[dev-dependencies]
mock-servers = { path = "../mock-servers" }
tempfile.workspace = true
