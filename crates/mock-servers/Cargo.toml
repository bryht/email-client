[package]
name = "mock-servers"
description = "本地模拟的微软登录 + Microsoft Graph 与 Gmail IMAP/SMTP，用于在没有真实账号时开发和测试收发信"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "letterdesk-mock"
path = "src/main.rs"

[dependencies]
mail-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
form_urlencoded = "1"

[dev-dependencies]
ureq = { version = "3", features = ["json"] }
